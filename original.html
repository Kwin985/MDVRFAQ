  <script type="text/javascript">
    const currentHash = window.location.hash;
    const headElement = document.head;
    const zhNav = document.querySelector('.zh-nav');
    const enNav = document.querySelector('.en-nav');
    const langBtn = document.querySelector('.custom-lang-btn');

    const projectConfig = {
      zhDoc: { 
        cssUrl: './static/css/topshi-zh.css',
        langBtnText: 'EN',
        langBtnHref: '#/13/64'
      },
      enDoc: { 
        cssUrl: './static/css/topshi-en.css',
        langBtnText: 'CN',
        langBtnHref: '#/11/62'
      },
      zhVideo: { 
        cssUrl: './static/css/topshi-zh.css',
        langBtnText: 'EN',
        langBtnHref: '#/12/63'
      },
      enVideo: { 
        cssUrl: './static/css/topshi-en.css',
        langBtnText: 'CN',
        langBtnHref: '#/8/27'
      }
    };

    let type = 'zhDoc';
    if (currentHash.includes('13')) type = 'enDoc';
    else if (currentHash.includes('8')) type = 'zhVideo';
    else if (currentHash.includes('12')) type = 'enVideo';

    const cssLink = document.createElement('link');
    cssLink.rel = 'stylesheet';
    cssLink.href = projectConfig[type].cssUrl;
    headElement.appendChild(cssLink);

    if (type === 'zhDoc' || type === 'zhVideo') {
      zhNav.style.display = 'flex';
      enNav.style.display = 'none';
    } else {
      enNav.style.display = 'flex';
      zhNav.style.display = 'none';
    }

    langBtn.textContent = projectConfig[type].langBtnText;
	
   langBtn.onclick = function() {
  const currentHash = window.location.hash; 

  const targetHash = langMapping[currentHash] || projectConfig[type].langBtnHref;
  window.location.href = targetHash; 
  };

    window.addEventListener('hashchange', () => window.location.reload());
  </script>
