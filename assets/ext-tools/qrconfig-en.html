<style>
  :root {
    --brand: #103048;
    --brand2: #2c5a7a;
    --bg: #f4f6f8;
    --card: #ffffff;
    --line: #e2e7ec;
    --text: #24313c;
    --muted: #7c8a95;
    --amber: #E8890C;
    --danger: #d64530;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; max-width: 520px; margin: 0 auto;
    padding: 0 16px calc(24px + env(safe-area-inset-bottom));
  }
  header {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand2) 100%);
    color: #fff; margin: 0 -16px; padding: 18px 16px 20px 20px;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  header .htxt { flex: 1; padding-right: 10px; }
  header h1 { font-size: 20px; font-weight: 600; letter-spacing: 1px; }
  header p  { font-size: 12px; opacity: .8; margin-top: 6px; line-height: 1.6; }
  .lang-btn {
    flex: none; background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.4);
    border-radius: 16px; padding: 6px 14px; font-size: 13px; cursor: pointer; margin-top: 2px;
  }
  .lang-btn:active { background: rgba(255,255,255,.3); }

  .tabs { display: flex; gap: 6px; margin: 14px 0 16px; }
  .tab {
    flex: 1; padding: 10px 4px; text-align: center; font-size: 13px;
    background: #e9edf1; color: var(--muted); border: none; border-radius: 8px;
    cursor: pointer; transition: all .15s; white-space: nowrap; overflow: hidden;
  }
  .tab.active { background: var(--brand); color: #fff; font-weight: 600; }

  .panel { display: none; animation: fade .2s; }
  .panel.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

  .card {
    background: var(--card); border-radius: 12px; padding: 16px;
    margin-bottom: 14px; box-shadow: 0 1px 3px rgba(16,48,72,.06);
  }
  .card h2 {
    font-size: 14px; color: var(--brand); margin-bottom: 12px;
    padding-left: 8px; border-left: 3px solid var(--amber); line-height: 1.2;
  }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input[type=text], .field input[type=password], .field select {
    width: 100%; height: 44px; padding: 0 12px; font-size: 15px;
    border: 1px solid var(--line); border-radius: 8px; background: #fbfcfd;
    color: var(--text); outline: none; transition: border .15s;
    -webkit-appearance: none; appearance: none;
  }
  .field select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='7'><path d='M1 1l5 5 5-5' stroke='%237c8a95' stroke-width='2' fill='none'/></svg>");
    background-repeat: no-repeat; background-position: right 12px center; padding-right: 34px;
  }
  .field input:focus, .field select:focus { border-color: var(--brand); background: #fff; }
  /* v7：校验非法态（生成时标红，修正输入即时清除） */
  .field input.invalid { border-color: #E24B4A; background: #fdf3f3; }
  .field input.invalid:focus { border-color: #E24B4A; }
  .field.disabled input { background: #f0f2f4; color: #aab4bc; }
  .field.disabled label { color: #b6bfc6; }
  .field .hint, .card > .hint { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .card > .hint { margin-top: 10px; }

  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    flex: 1; height: 42px; border: none; background: #fbfcfd; font-size: 14px;
    color: var(--muted); cursor: pointer;
  }
  .seg button.on { background: var(--brand); color: #fff; font-weight: 600; }

  .switch-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .switch-row span { font-size: 14px; font-weight: 600; }
  /* 808 服务器 2 折叠：未启用时只显示“启用”开关，其余配置项隐藏；启用后展开 */
  .collapse-body { overflow: hidden; }
  .collapse-body.collapsed { display: none; }
  .switch { position: relative; width: 48px; height: 28px; }
  .switch input { opacity: 0; width: 100%; height: 100%; position: absolute; z-index: 2; cursor: pointer; }
  .switch .track {
    position: absolute; inset: 0; background: #d5dbe0; border-radius: 14px; transition: .2s;
  }
  .switch .track::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
    background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  .switch input:checked + .track { background: var(--brand); }
  .switch input:checked + .track::after { left: 23px; }

  .divider { height: 1px; background: var(--line); margin: 16px -16px; }

  .nav { display: flex; gap: 10px; margin-top: 18px; }
  .btn {
    flex: 1; height: 48px; border: none; border-radius: 10px; font-size: 16px;
    cursor: pointer; transition: opacity .15s;
  }
  .btn-ghost { background: #e9edf1; color: var(--text); }
  .btn-main  { background: var(--brand); color: #fff; font-weight: 600; }
  .btn-main:active { opacity: .85; }
  .btn-gen {
    display: block; width: 100%; height: 52px; margin-top: 6px;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    color: #fff; font-size: 17px; font-weight: 600; border: none; border-radius: 12px;
    box-shadow: 0 4px 12px rgba(16,48,72,.25); cursor: pointer;
  }
  .btn-gen:active { transform: translateY(1px); }

  #result { display: none; }
  .qr-wrap { text-align: center; padding: 20px 0 8px; }
  #qrcode { display: inline-block; padding: 12px; background: #fff; border-radius: 12px; }
  .qr-tip { font-size: 13px; color: var(--muted); margin-top: 12px; line-height: 1.7; }
  .xml-box {
    width: 100%; min-height: 140px; max-height: 220px; overflow: auto;
    font-family: Menlo, Consolas, monospace; font-size: 11px; line-height: 1.6;
    background: #f7f9fa; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; color: #37474f; white-space: pre; margin-top: 8px;
  }
  .toast {
    position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%) translateY(20px);
    background: rgba(16,48,72,.92); color: #fff; font-size: 13px;
    padding: 10px 18px; border-radius: 20px; opacity: 0; transition: all .25s;
    pointer-events: none; z-index: 99; max-width: 86%;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .langhint { margin-top:6px; font-size:11.5px; opacity:.85; line-height:1.55; }
  .langhint b { font-weight:600; color:#ffd79a; }
  .sub2 b { font-weight:600; color:#fff; }

  /* ═══ header 紧凑化（v6）：标题+按钮同行，说明整行铺满 ═══ */
  header { padding: 13px 16px 14px !important; display: block !important; }  /* 原来是 flex，会把 .hrow 和 p 横排 */
  header .hrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  header .hrow h1 { font-size: 18px !important; margin: 0 !important; letter-spacing: .5px; }
  header .hbtns { display: flex; gap: 6px; flex: none; }
  header .hbtns .lang-btn { padding: 5px 12px !important; font-size: 12px !important; margin-top: 0 !important; }
  header p[data-i18n="subtitle"] {
    display: block; width: 100%; margin: 8px 0 0 !important;
    font-size: 11.5px !important; line-height: 1.55 !important; opacity: .86;
  }
  header p[data-i18n="subtitle"] b { font-weight: 600; color: #ffd79a; }
</style>
</head>

<header>
  <div class="hrow">
    <h1 data-i18n="title"></h1>
    <div class="hbtns">
      <a class="lang-btn" id="btn_help" data-i18n="help" href="/en/docs/675/"
       target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">Guide</a>
      <a class="lang-btn" id="btn_lang" href="qrconfig-zh.html" title="Switch to Chinese">中文</a>
    </div>
  </div>
  <p data-i18n="subtitle"></p>
</header>

<div id="wizard">
  <div class="tabs">
    <button class="tab" data-tab="0" data-i18n="tab_tz"></button>
    <button class="tab" data-tab="1" data-i18n="tab_45g"></button>
    <button class="tab" data-tab="2" data-i18n="tab_center"></button>
    <button class="tab" data-tab="3" data-i18n="tab_808"></button>
  </div>

  <!-- TAB 0：时区 -->
  <div class="panel" data-panel="0">
    <div class="card">
      <h2 data-i18n="h_tz"></h2>
      <div class="field">
        <label data-i18n="l_timezone"></label>
        <select id="f_timezone"></select>
        <div class="hint" data-i18n="hint_tz"></div>

<script>
'use strict';
var $ = function (id) { return document.getElementById(id); };
var curTab = 0;

/* ================= 中英文 ================= */
var I18N = {

  en: {
    title: 'Quick QR Config',
    help: 'Guide',
    subtitle: 'Fill in the tabs → Generate QR → Scan with the device<br><b>⚠ QR import is available within 5 minutes after power-on; it closes automatically after that — power-cycle the device to scan again</b>',
    err_nonascii: 'The configuration contains non-ASCII characters the device cannot read. Please use English letters or digits for APN, username, password and domain.',
    tab_tz: 'Time Zone', tab_45g: '4/5G', tab_center: 'Center', tab_808: '808',
    h_tz: 'Time Zone',
    l_timezone: 'Time Zone',
    hint_tz: 'The selected time zone is always written into the QR code (including the default UTC+8).',
    h_45g: '4/5G Dial-up',
    l_user: 'Username', l_pwd: 'Password', l_dial: 'Dial Number',
    hint_45g: 'Prefilled defaults: unchanged fields are excluded from the QR code.',
    h_center: 'Center Platform',
    l_device_no: 'Device No.', l_conn: 'Connection', l_srv_ip: 'Server IP',
    l_domain: 'Domain', l_port: 'Port',
    hint_center: 'Empty fields keep device values. IP / Domain are mutually exclusive. Port hint e.g. 6608: written only when filled.',
    h_p1: '808 Platform 1', h_p2: '808 Platform 2',
    l_enable_p1: 'Enable Platform 1', l_enable_p2: 'Enable Platform 2',
    l_phone: 'Phone No.', l_devnum: 'Device No.', l_conn_mb: 'Connection (main & backup)',
    l_bak_ip: 'Backup IP', l_bak_domain: 'Backup Domain', l_bak_port: 'Backup Port',
    seg_ip: 'IP', seg_domain: 'Domain',
    ph_devid: 'e.g. 20007', ph_ip: 'e.g. 139.9.251.220', ph_phone: 'e.g. 13800138000', ph_port: 'e.g. 6608',
    err_devid: 'Device No.: letters and digits only, max 12 characters',
    err_ip: 'Invalid IP address format',
    err_domain: 'Invalid domain name format',
    err_port: 'Port must be a number from 1025 to 65535',
    err_phone: 'Phone: digits only, max 11 characters',
    ph_domain: 'e.g. server.example.com', ph_bak_ip: 'Backup server IP',
    btn_prev: 'Prev', btn_next: 'Next', btn_next_last: 'Generate',
    btn_gen: 'Generate QR Code',
    res_title: 'QR Code',
    qr_tip: 'Scan this QR code with the device to import settings',
    xml_title: 'Config Content (XML)',
    btn_back: 'Back to Edit', btn_copy: 'Copy XML',
    toast_empty: 'All values are defaults. Please modify or fill in at least one field.',
    toast_copied: 'Copied to clipboard',
  }
};
var lang = 'en';   /* 本文件固定 en 版，无语言切换 */
/* ★ 操作说明按钮：把英文 FAQ 文档地址填到下面（非空即自动显示按钮） */
var HELP_URL = '/en/docs/675/';
(function(){ var a=document.getElementById('btn_help');
  if(a && HELP_URL){ a.href=HELP_URL; a.style.display='inline-block'; } })();

function applyLang() {
  var T = I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var k = el.getAttribute('data-i18n');
    if (T[k] !== undefined) el.innerHTML = T[k];   /* 用 innerHTML 以支持文案里的 <b> 高亮 */
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(function (el) {
    var k = el.getAttribute('data-i18n-ph');
    if (T[k] !== undefined) el.setAttribute('placeholder', T[k]);
  });
  document.documentElement.lang = (lang === 'zh') ? 'zh-CN' : 'en';
  $('btn_next').textContent = (curTab === 3) ? T.btn_next_last : T.btn_next;
}

/* ================= 时区表（与设备端一致：UTC-12 ~ UTC+14，值 = 下标，UTC+8 = 20） ================= */
(function () {
  var sel = $('f_timezone');
  for (var h = -12; h <= 14; h++) {
    var off = (h < 0 ? '-' : '+') + String(Math.abs(h)).padStart(2, '0');
    var o = document.createElement('option');
    o.value = String(h + 12);
    o.textContent = 'UTC' + off;
    if (h === 8) o.selected = true;   /* 预填默认 UTC+8；未修改不进 XML */
    sel.appendChild(o);
  }
})();

/* ================= 预填默认值（用户未修改的字段不进 XML） ================= */
/* v5：端口不再预填（placeholder 提示式「如 6608」），DEFAULTS 仅剩 4G 四项 */
var DEFAULTS = { f_apn: '3gnet', f_user: 'card', f_pwd: 'card', f_dial: '*99#' };
function modified(id) { return v(id) !== DEFAULTS[id]; }

/* ================= TAB 切换 ================= */
function showTab(i) {
  curTab = i;
  document.querySelectorAll('.tab[data-tab]').forEach(function (b) {
    b.classList.toggle('active', +b.dataset.tab === i);
  });
  document.querySelectorAll('.panel').forEach(function (p) {
    p.classList.toggle('active', +p.dataset.panel === i);
  });
  $('btn_prev').style.visibility = (i === 0) ? 'hidden' : 'visible';
  $('btn_next').textContent = (i === 3) ? I18N[lang].btn_next_last : I18N[lang].btn_next;
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tab[data-tab]').forEach(function (b) {
  b.addEventListener('click', function () { showTab(+b.dataset.tab); });
});
$('btn_prev').addEventListener('click', function () { if (curTab > 0) showTab(curTab - 1); });
$('btn_next').addEventListener('click', function () {
  if (curTab < 3) showTab(curTab + 1); else generate();
});

/* ================= IP / 域名互斥（中心 + 808 两平台，主/备共用连接方式） ================= */
function bindSeg(segId, ipFieldId, domainFieldId, bakIpFieldId, bakDomainFieldId) {
  var seg = $(segId), val = 0;
  seg.querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () {
      val = +b.dataset.v;
      seg.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      apply();
    });
  });
  function apply() {
    var isIP = (val === 0);
    ($(ipFieldId)).classList.toggle('disabled', !isIP);
    ($(ipFieldId)).querySelector('input').disabled = !isIP;
    ($(domainFieldId)).classList.toggle('disabled', isIP);
    ($(domainFieldId)).querySelector('input').disabled = isIP;
    if (bakIpFieldId) {
      ($(bakIpFieldId)).classList.toggle('disabled', !isIP);
      ($(bakIpFieldId)).querySelector('input').disabled = !isIP;
      ($(bakDomainFieldId)).classList.toggle('disabled', isIP);
      ($(bakDomainFieldId)).querySelector('input').disabled = isIP;
    }
  }
  apply();
  return { get: function () { return val; } };
}
var cConn  = bindSeg('c_seg',  'c_ip_f',  'c_domain_f');
var p1Conn = bindSeg('p1_seg', 'p1_ip_f', 'p1_domain_f', 'p1_bip_f', 'p1_bdomain_f');
var p2Conn = bindSeg('p2_seg', 'p2_ip_f', 'p2_domain_f', 'p2_bip_f', 'p2_bdomain_f');

/* ================= 808 服务器 2 折叠：启用开关控制其余配置项显隐 ================= */
function syncP2() {
  var body = $('p2_body');
  if (body) body.classList.toggle('collapsed', !$('p2_en').checked);
}
if ($('p2_en')) {
  $('p2_en').addEventListener('change', syncP2);
  syncP2();
}

/* ================= 输入校验（v7）=================
 * 即时过滤：input 时剥离非法字符（maxlength 由 HTML 属性限制长度）；
 * 生成校验：generate() 前统一校验非空字段格式，非法标红 + toast 首个错误。
 * 空 = 未填写，跳过校验（沿用「留空不写入」规则）。 */
var RE_IP     = /^(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}$/;
var RE_DOMAIN = /^[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*\.[a-zA-Z]{2,}$/;
var RE_ALNUM  = /^[A-Za-z0-9]*$/;
var RE_DIGITS = /^\d*$/;

/* 即时过滤表：{id, keep}——keep 为允许字符正则（全局 g 剥离其余） */
var SANITIZE = [
  { id: 'f_devid',  keep: /[^A-Za-z0-9]/g },                 /* 中心设备编号 */
  { id: 'c_ip',     keep: /[^0-9.]/g },                      /* IP 允许过渡输入点分 */
  { id: 'c_domain', keep: /[^A-Za-z0-9.-]/g },
  { id: 'c_port',   keep: /\D/g },
  { id: 'p1_phone', keep: /\D/g },  { id: 'p2_phone', keep: /\D/g },
  { id: 'p1_devnum', keep: /[^A-Za-z0-9]/g }, { id: 'p2_devnum', keep: /[^A-Za-z0-9]/g },
  { id: 'p1_ip',    keep: /[^0-9.]/g }, { id: 'p2_ip',    keep: /[^0-9.]/g },
  { id: 'p1_bip',   keep: /[^0-9.]/g }, { id: 'p2_bip',   keep: /[^0-9.]/g },
  { id: 'p1_domain', keep: /[^A-Za-z0-9.-]/g }, { id: 'p2_domain', keep: /[^A-Za-z0-9.-]/g },
  { id: 'p1_bdomain', keep: /[^A-Za-z0-9.-]/g }, { id: 'p2_bdomain', keep: /[^A-Za-z0-9.-]/g },
  { id: 'p1_port',  keep: /\D/g }, { id: 'p2_port',  keep: /\D/g },
  { id: 'p1_bport', keep: /\D/g }, { id: 'p2_bport', keep: /\D/g },
];
SANITIZE.forEach(function (s) {
  var el = $(s.id);
  if (!el) return;
  el.addEventListener('input', function () {
    var clean = el.value.replace(s.keep, '');
    if (clean !== el.value) el.value = clean;
    /* 修正即清除红框 */
    el.classList.remove('invalid');
  });
});

/* 生成时格式校验表：{id, test, err}——非空才校验 */
var VALIDATORS = [
  { id: 'f_devid',  test: function (x) { return RE_ALNUM.test(x) && x.length <= 12; }, err: 'err_devid' },
  { id: 'c_ip',     test: function (x) { return RE_IP.test(x); },     err: 'err_ip' },
  { id: 'c_domain', test: function (x) { return RE_DOMAIN.test(x); }, err: 'err_domain' },
  { id: 'c_port',   test: function (x) { return /^\d+$/.test(x) && +x >= 1025 && +x <= 65535; }, err: 'err_port' },
  { id: 'p1_phone', test: function (x) { return RE_DIGITS.test(x) && x.length <= 11; }, err: 'err_phone' },
  { id: 'p2_phone', test: function (x) { return RE_DIGITS.test(x) && x.length <= 11; }, err: 'err_phone' },
  { id: 'p1_devnum', test: function (x) { return RE_ALNUM.test(x) && x.length <= 12; }, err: 'err_devid' },
  { id: 'p2_devnum', test: function (x) { return RE_ALNUM.test(x) && x.length <= 12; }, err: 'err_devid' },
  { id: 'p1_ip',   test: function (x) { return RE_IP.test(x); },     err: 'err_ip' },
  { id: 'p2_ip',   test: function (x) { return RE_IP.test(x); },     err: 'err_ip' },
  { id: 'p1_bip',  test: function (x) { return RE_IP.test(x); },     err: 'err_ip' },
  { id: 'p2_bip',  test: function (x) { return RE_IP.test(x); },     err: 'err_ip' },
  { id: 'p1_domain', test: function (x) { return RE_DOMAIN.test(x); }, err: 'err_domain' },
  { id: 'p2_domain', test: function (x) { return RE_DOMAIN.test(x); }, err: 'err_domain' },
  { id: 'p1_bdomain', test: function (x) { return RE_DOMAIN.test(x); }, err: 'err_domain' },
  { id: 'p2_bdomain', test: function (x) { return RE_DOMAIN.test(x); }, err: 'err_domain' },
  /* v7b：808 四个端口补 err 键——漏写时 validateAll 返回 undefined，
   * if(err) 判假 → 红框亮但不拦截生成（787878/999999 可生成的根因） */
  { id: 'p1_port',  test: portOK, err: 'err_port' },
  { id: 'p2_port',  test: portOK, err: 'err_port' },
  { id: 'p1_bport', test: portOK, err: 'err_port' },
  { id: 'p2_bport', test: portOK, err: 'err_port' },
];
function portOK(x) { return /^\d+$/.test(x) && +x >= 1025 && +x <= 65535; }

/* 全量校验：所有非空非法字段标红；返回首个错误的 toast 键（null = 全部通过） */
function validateAll() {
  var firstErr = null;
  VALIDATORS.forEach(function (r) {
    var el = $(r.id), x = v(r.id);
    var bad = x !== '' && !r.test(x);
    el.classList.toggle('invalid', bad);
    if (bad && !firstErr) firstErr = r.err;
  });
  return firstErr;
}

/* ================= XML 生成 ================= */
function v(id) { var e = $(id); return e ? String(e.value || '').trim() : ''; }
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
}
function attrs(pairs) {
  return pairs.filter(function (p) { return p[1] !== ''; })
              .map(function (p) { return p[0] + '="' + esc(p[1]) + '"'; })
              .join(' ');
}
function node(name, pairs) {
  var a = attrs(pairs);
  if (!a) return '';
  return '  <' + name + ' ' + a + ' />';
}

function buildXML() {
  var lines = [];

  /* stBaseInfo：设备编号（中心 TAB）+ 时区；属性顺序照 config.xml 模板。
   * v4：时区为特殊字段——选中即写入（含默认 UTC+8，用户可能确实需要显式配置）。 */
  var base = [];
  if (v('f_devid') !== '')        base.push(['strFD_DeviceNo', v('f_devid')]);
  if (v('f_timezone') !== '')     base.push(['ucFD_TimeZone', v('f_timezone')]);
  var n = node('stBaseInfo', base); if (n) lines.push(n);

  /* stCMS：中心平台（任一参数填写才生成；连接方式随节写入；端口留空不写入） */
  var cmsIP = v('c_ip'), cmsDomain = v('c_domain');
  var cmsPort = v('c_port');
  if (cmsIP || cmsDomain || cmsPort || v('f_devid')) {
    var isIPc = (cConn.get() === 0);
    lines.push(node('stCMS', [
      ['ucFD_AddressType', String(cConn.get())],
      ['uiFD_IP',  isIPc ? cmsIP : ''],
      ['strFD_Domain', isIPc ? '' : cmsDomain],
      ['usFD_Port', cmsPort],
    ]));
  }

  /* stMobileGNet：4/5G 拨号——预填默认值未修改的字段不写入；全部未修改则整节不生成 */
  var apn = modified('f_apn') ? v('f_apn') : '';
  var user = modified('f_user') ? v('f_user') : '';
  var pwd = modified('f_pwd') ? v('f_pwd') : '';
  var dial = modified('f_dial') ? v('f_dial') : '';
  if (apn || user || pwd || dial) {
    lines.push(node('stMobileGNet', [
      ['ucFD_NetType', '0'],
      ['strFD_Apn', apn],
      ['strFD_PhoneNo', dial],
      ['strFD_UserName', user],
      ['strFD_UserPasswd', pwd],
    ]));
  }

  /* stNetWorkMode + 808 各节：平台使能才生成 */
  var en1 = $('p1_en').checked, en2 = $('p2_en').checked;
  if (en1 || en2) {
    var enVal = (en1 ? 1 : 0) + (en2 ? 128 : 0);
    lines.push(node('stNetWorkMode', [['ucFD_EnableHR808', String(enVal)]]));

    /* ---- 平台 1：st808CMS1（主）/ st808CMS2（备）/ stCarInfo ---- */
    if (en1) {
      var isIP1 = (p1Conn.get() === 0);
      lines.push(node('st808CMS1', [
        ['ucFD_AddressType', String(p1Conn.get())],
        ['uiFD_IP', isIP1 ? v('p1_ip') : ''],
        ['strFD_Domain', isIP1 ? '' : v('p1_domain')],
        ['usFD_Port', v('p1_port')],
      ]));
      var car1 = node('stCarInfo', [
        ['strFD_DeviceNum', v('p1_devnum')],
        ['strFD_Phonenumber', v('p1_phone')],
        ['strFD_TerminalID', v('p1_devnum')],
      ]);
      if (car1) lines.push(car1);
      lines.push(node('st808CMS2', [
        ['ucFD_AddressType', String(p1Conn.get())],
        ['uiFD_IP', isIP1 ? v('p1_bip') : ''],
        ['strFD_Domain', isIP1 ? '' : v('p1_bdomain')],
        ['usFD_Port', v('p1_bport')],
      ]));
    }

    /* ---- 平台 2：st1078CMS1 / st1078CMS2 / stCarInfo1 ---- */
    if (en2) {
      var isIP2 = (p2Conn.get() === 0);
      lines.push(node('st1078CMS1', [
        ['ucFD_AddressType', String(p2Conn.get())],
        ['uiFD_IP', isIP2 ? v('p2_ip') : ''],
        ['strFD_Domain', isIP2 ? '' : v('p2_domain')],
        ['usFD_Port', v('p2_port')],
      ]));
      var car2 = node('stCarInfo1', [
        ['strFD_DeviceNum', v('p2_devnum')],
        ['strFD_Phonenumber', v('p2_phone')],
        ['strFD_TerminalID', v('p2_devnum')],
      ]);
      if (car2) lines.push(car2);
      lines.push(node('st1078CMS2', [
        ['ucFD_AddressType', String(p2Conn.get())],
        ['uiFD_IP', isIP2 ? v('p2_bip') : ''],
        ['strFD_Domain', isIP2 ? '' : v('p2_bdomain')],
        ['usFD_Port', v('p2_bport')],
      ]));
    }
  }

  return '<?xml version="1.0" encoding="UTF-8" ?>\n<VariCfgSec>\n' +
         lines.join('\n') + '\n</VariCfgSec>';
}

/* ================= 生成与展示 ================= */
var lastXML = '';
function toast(key) {
  var t = $('toast');
  t.textContent = I18N[lang][key];
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(function () { t.classList.remove('show'); }, 2200);
}

function generate() {
  /* v7：生成前全量格式校验——非法字段标红 + toast 首个错误，不生成 */
  var err = validateAll();
  if (err) { toast(err); return; }
  lastXML = buildXML();
  if (lastXML.indexOf('<st') < 0 && lastXML.indexOf('ucFD') < 0) {
    toast('toast_empty');
    return;
  }
  /* ★ v8 新增：设备端按 ASCII 处理，含非 ASCII（中文等）会生成设备认不出的码，直接拦 */
  if (/[^\x00-\x7F]/.test(lastXML)) { toast('err_nonascii'); return; }
  $('wizard').style.display = 'none';
  $('result').style.display = 'block';
  $('xml_preview').textContent = lastXML;

  var box = $('qrcode');
  box.innerHTML = '';
  /* ★ v8 修正：直接传 XML 原文。
     本版 qrcodejs 自带 UTF-8 处理，外面再手工编码会造成【双重编码 + 多插 3 字节 BOM】
     （"测" e6 b5 8b → c3 a6 c2 b5 c2 8b），设备按 UTF-8 解码就是乱码。
     纯 ASCII 输入时，库原样写入，二维码内字节 == XML 的 UTF-8 字节，无 BOM。 */
  new QRCode(box, {
    text: lastXML,
    width: 260, height: 260,
    colorDark: '#103048', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M,
  });
  window.scrollTo(0, 0);
}

$('btn_gen').addEventListener('click', generate);
$('btn_back').addEventListener('click', function () {
  $('result').style.display = 'none';
  $('wizard').style.display = 'block';
  window.scrollTo(0, 0);
});
$('btn_copy').addEventListener('click', function () {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(lastXML).then(function () { toast('toast_copied'); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = lastXML;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('toast_copied');
  }
});

applyLang();
showTab(0);
</script>

</script>
